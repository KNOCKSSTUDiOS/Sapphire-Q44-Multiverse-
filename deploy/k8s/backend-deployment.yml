# NEBULA Multiverse Studio — Backend Deployment | Architect: KNOCKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-backend
  namespace: nebula
  labels:
    app: nebula-backend
    app.kubernetes.io/part-of: nebula-multiverse-studio
    app.kubernetes.io/managed-by: knocks-architect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nebula-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nebula-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      # imagePullSecrets:
      #   - name: nebula-registry-creds
      containers:
        - name: backend
          image: REPLACE_WITH_YOUR_REGISTRY/nebula-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: nebula-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nebula-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nebula-secrets
                  key: JWT_SECRET
            - name: NEBULA_MASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nebula-secrets
                  key: NEBULA_MASTER_API_KEY
            - name: RENDER_ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nebula-secrets
                  key: RENDER_ORCHESTRATOR_TOKEN
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nebula-backend
