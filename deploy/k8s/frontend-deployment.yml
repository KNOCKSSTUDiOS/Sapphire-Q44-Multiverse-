# NEBULA Multiverse Studio — Frontend Deployment | Architect: KNOCKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-frontend
  namespace: nebula
  labels:
    app: nebula-frontend
    app.kubernetes.io/part-of: nebula-multiverse-studio
    app.kubernetes.io/managed-by: knocks-architect
    universe: primeverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nebula-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nebula-frontend
        universe: primeverse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # imagePullSecrets:
      #   - name: nebula-registry-creds
      containers:
        - name: frontend
          image: REPLACE_WITH_YOUR_REGISTRY/nebula-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: nebula-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nebula-frontend
