# =============================================================================
# NEBULA Multiverse Studio — ConfigMap (non-sensitive runtime config)
# Architect: KNOCKS
# Domain:  hollywoodimaging.studio
# IP:      47.33.68.218
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nebula-config
  namespace: nebula
  labels:
    app.kubernetes.io/part-of: nebula-multiverse-studio
    app.kubernetes.io/managed-by: knocks-architect
data:
  # ── Application ─────────────────────────────────────────────────────────────
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"

  # ── NEBULA Universe Identifiers ──────────────────────────────────────────────
  PRIME_VERSE_ID:  "primeverse-001"
  SHADOW_VERSE_ID: "shadowverse-001"
  NEON_VERSE_ID:   "neonverse-001"
  MYTH_VERSE_ID:   "mythverse-001"

  # ── Render Orchestrator (internal K8s cluster DNS) ───────────────────────────
  RENDER_ORCHESTRATOR_URL:        "http://nebula-render-orchestrator-svc:4000"
  RENDER_ORCHESTRATOR_TIMEOUT_MS: "30000"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  VITE_API_BASE_URL: "/api"
  CORS_ORIGIN:       "https://hollywoodimaging.studio"

  # ── Feature Flags ────────────────────────────────────────────────────────────
  ENABLE_TIMELINE_FUSION:   "true"
  ENABLE_MULTIVERSE_ROUTER: "true"

  # ── Observability ────────────────────────────────────────────────────────────
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-svc:4317"
  OTEL_SERVICE_NAME:           "nebula-backend"
